    primarySelected: "${palette.brand[600]}"
    primarySelectedHovered: "${palette.brand[700]}"
    primaryMark: "${palette.white}"
    utilitySelected: "${palette.utility[700]}"
    utilitySelectedHovered: "${palette.utility[800]}"
    utilityMark: "${palette.white}"
    dangerSelected: "${palette.danger[700]}"

    background: "${palette.white}"
    foreground: "${palette.neutral[900]}"
    supporting: "${palette.neutral[600]}"
    border: "${palette.neutral[300]}"
    hovered: "${palette.neutral[100]}"
    selected: "${palette.brand[100]}"
    scrim: "#11111673"
    tooltipBackground: "${palette.neutral[900]}"
    tooltipForeground: "${palette.white}"

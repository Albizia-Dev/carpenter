    warningStateStrong: "#7A480033"
    successState: "#176B381C"
    successStateStrong: "#176B3833"
    infoState: "#145C871C"
    infoStateStrong: "#145C8733"
    stateInverse: "#FFFFFF24"
  field:
    background: "${palette.white}"
    backgroundHovered: "${palette.neutral[50]}"
    backgroundDisabled: "${palette.neutral[100]}"
    foreground: "${palette.neutral[900]}"
    placeholder: "${palette.neutral[500]}"
    border: "${palette.neutral[300]}"

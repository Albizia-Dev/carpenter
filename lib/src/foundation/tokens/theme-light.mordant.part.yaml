    base: "${palette.white}"
    subtle: "${palette.neutral[50]}"
  action:
    neutral: "${palette.neutral[700]}"
    neutralHover: "${palette.neutral[800]}"
    neutralPressed: "${palette.neutral[900]}"
    primary: "${palette.brand[600]}"
    primaryHover: "${palette.brand[700]}"
    primaryPressed: "${palette.brand[800]}"
    utility: "${palette.utility[600]}"
    utilityHover: "${palette.utility[700]}"
    utilityPressed: "${palette.utility[800]}"
    danger: "${palette.danger[700]}"
    dangerHover: "${palette.danger[900]}"
    dangerPressed: "${palette.danger[900]}"
    warning: "${palette.warning[700]}"
    warningHover: "${palette.warning[900]}"
    warningPressed: "${palette.warning[900]}"
    success: "${palette.success[700]}"
    successHover: "${palette.success[900]}"
    successPressed: "${palette.success[900]}"
    info: "${palette.info[700]}"
    infoHover: "${palette.info[900]}"

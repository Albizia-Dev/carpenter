name: Documentation workbench

on:
  push:
    branches:
      - docs/api-widgetbook-coverage

permissions:
  contents: read

concurrency:
  group: documentation-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Export documentation audit inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD > documentation-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-source
          path: documentation-source.tar
          retention-days: 1
          if-no-files-found: error

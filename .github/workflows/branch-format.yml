name: Branch format

on:
  push:
    branches:
      - feat/context-actions-0.2.1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/context-actions-0.2.1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart format lib/src/components/behaviour/context_actions.dart lib/src/components/collections/table/table.dart
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/components/behaviour/context_actions.dart lib/src/components/collections/table/table.dart
          git commit -m "style: format context action changes"
          git push

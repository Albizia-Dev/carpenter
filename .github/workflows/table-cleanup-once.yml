name: Cleanup table formatter noise once

on:
  push:
    branches:
      - feat/table-layout-actions

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/table-layout-actions
          fetch-depth: 0

      - name: Restore unrelated library formatting
        shell: bash
        run: |
          git fetch origin develop
          keep='^(lib/carpenter.dart|lib/src/components/layout/toolbar.dart|lib/src/components/collections/table/table_actions.dart|lib/src/components/collections/table/table_text.dart|lib/src/components/collections/table/table_column.dart|lib/src/components/collections/table/table.dart|lib/src/components/collections/tree/tree_table.dart)$'
          while IFS= read -r file; do
            if [[ ! "$file" =~ $keep ]]; then
              git checkout origin/develop -- "$file"
            fi
          done < <(git diff --name-only origin/develop...HEAD -- lib)

      - name: Remove table analyzer warning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/src/components/collections/tree/tree_table.dart')
          text = path.read_text()
          old = """  ) {\n    final theme = CarpenterTheme.of(context);\n    final primary ="""
          new = """  ) {\n    final primary ="""
          if old not in text:
              raise SystemExit('target snippet not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git add lib/src/components/collections/tree/tree_table.dart

      - name: Commit cleanup
        run: |
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: remove tree table analyzer warning"
          git push origin HEAD:feat/table-layout-actions

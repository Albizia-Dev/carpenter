name: Verify unified icon sources

on:
  push:
    branches: [feat/unified-icon-data]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install package dependencies
        run: flutter pub get
      - name: Reject legacy IconData icon slots
        run: |
          if grep -R -n --include='*.dart' -E 'final[[:space:]]+IconData\??[[:space:]]+(leadingIcon|icon)[[:space:]]*;' lib; then
            echo 'Legacy IconData icon slot remains in lib.'
            exit 1
          fi
      - name: Format changed sources
        run: dart format lib test/basic/icon_test.dart widgetbook/lib/use_cases/foundation/gravity_icons.dart
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib test/basic/icon_test.dart widgetbook/lib/use_cases/foundation/gravity_icons.dart
            git commit -m 'style: format unified icon sources'
            git push
          fi
      - name: Analyze library
        run: dart analyze lib
      - name: Run tests
        run: flutter test
      - name: Install Widgetbook dependencies
        working-directory: widgetbook
        run: flutter pub get
      - name: Analyze Widgetbook
        working-directory: widgetbook
        run: dart analyze
      - name: Build Widgetbook web
        working-directory: widgetbook
        run: flutter build web --release --base-href /carpenter/

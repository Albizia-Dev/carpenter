name: UI polish token sync

on:
  push:
    branches:
      - fix/ui-component-polish

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-component-polish

      - name: Make field gaps size-aware
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          yaml_path = Path('lib/src/foundation/tokens/components.mordant.part.yaml')
          text = yaml_path.read_text()

          blocks = {
              'labelGap': '''    labelGap:\n      xsmall: 0.25rem\n      small: 0.3125rem\n      medium: 0.375rem\n      large: 0.4375rem\n      xlarge: 0.5rem\n\n''',
              'compactLabelGap': '''    compactLabelGap:\n      xsmall: 0.125rem\n      small: 0.1875rem\n      medium: 0.25rem\n      large: 0.3125rem\n      xlarge: 0.375rem\n\n''',
              'supportingGap': '''    supportingGap:\n      xsmall: 0.125rem\n      small: 0.1875rem\n      medium: 0.25rem\n      large: 0.3125rem\n      xlarge: 0.375rem\n\n''',
              'compactSupportingGap': '''    compactSupportingGap:\n      xsmall: 0.0625rem\n      small: 0.125rem\n      medium: 0.1875rem\n      large: 0.25rem\n      xlarge: 0.3125rem\n\n''',
          }
          order = [
              ('labelGap', 'compactLabelGap'),
              ('compactLabelGap', 'supportingGap'),
              ('supportingGap', 'compactSupportingGap'),
              ('compactSupportingGap', 'scrollPadding'),
          ]
          for name, next_name in order:
              pattern = rf'    {name}:\n.*?(?=    {next_name}:)'
              text, count = re.subn(pattern, blocks[name], text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'failed to replace YAML block {name}: {count}')
          yaml_path.write_text(text)

          generated_path = Path('lib/src/foundation/tokens/carpenter.mordant.g.dart')
          generated = generated_path.read_text()
          classes = {
              'ComponentFieldLabelGapTokens': [0.25, 0.3125, 0.375, 0.4375, 0.5],
              'ComponentFieldCompactLabelGapTokens': [0.125, 0.1875, 0.25, 0.3125, 0.375],
              'ComponentFieldSupportingGapTokens': [0.125, 0.1875, 0.25, 0.3125, 0.375],
              'ComponentFieldCompactSupportingGapTokens': [0.0625, 0.125, 0.1875, 0.25, 0.3125],
          }
          names = ['xsmall', 'small', 'medium', 'large', 'xlarge']
          for class_name, values in classes.items():
              getters = '\n\n'.join(
                  f'  _i1.Rem get {name} => const _i1.Rem({value});'
                  for name, value in zip(names, values)
              )
              replacement = (
                  f'final class {class_name} {{\n'
                  f'  const {class_name}();\n\n'
                  f'{getters}\n'
                  f'}}\n'
              )
              pattern = rf'final class {class_name} \{{.*?\n\}}\n'
              generated, count = re.subn(
                  pattern,
                  replacement,
                  generated,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'failed to replace generated class {class_name}: {count}')
          generated_path.write_text(generated)
          PY

      - name: Commit synchronized sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/foundation/tokens/components.mordant.part.yaml
          git add lib/src/foundation/tokens/carpenter.mordant.g.dart
          git rm .github/workflows/ui-polish-token-sync.yml
          git commit -m "fix: make field gaps size-aware"
          git push

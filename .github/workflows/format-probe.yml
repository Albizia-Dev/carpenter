name: Format Probe

on:
  push:
    branches:
      - feat/masked-input-dnd-kernel

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format changed library files
        run: |
          dart format \
            lib/src/components/basic/input/adaptive_picker.dart \
            lib/src/components/basic/input/date_input.dart \
            lib/src/components/basic/input/date_range_input.dart \
            lib/src/components/basic/input/masked_input.dart \
            lib/src/components/behaviour/drag_and_drop/drag_scope.dart \
            lib/src/components/behaviour/drag_and_drop/draggable.dart \
            lib/src/components/behaviour/drag_and_drop/drop_target.dart \
            lib/src/components/collections/breadcrumbs.dart
          git diff -- \
            lib/src/components/basic/input/adaptive_picker.dart \
            lib/src/components/basic/input/date_input.dart \
            lib/src/components/basic/input/date_range_input.dart \
            lib/src/components/basic/input/masked_input.dart \
            lib/src/components/behaviour/drag_and_drop/drag_scope.dart \
            lib/src/components/behaviour/drag_and_drop/draggable.dart \
            lib/src/components/behaviour/drag_and_drop/drop_target.dart \
            lib/src/components/collections/breadcrumbs.dart

name: Document changed theme resolvers once

on:
  push:
    branches:
      - refactor/theme-composition

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/theme-composition
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Add resolver DartDoc, format, and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/src/foundation/theme.dart')
          text = path.read_text()
          replacements = {
              '  Color resolve(ContentColorRole role) => switch (role) {': '  /// Resolves the semantic foreground color assigned to [role].\n  Color resolve(ContentColorRole role) => switch (role) {',
              '  Color resolve(Set<WidgetState> states) {': '  /// Resolves this action palette for the supplied interaction [states].\n  Color resolve(Set<WidgetState> states) {',
              '  CarpenterActionStyle resolve(\n': '  /// Resolves action colors from semantic role, prominence, and interaction state.\n  CarpenterActionStyle resolve(\n',
              '  CarpenterFieldStyle resolve({\n': '  /// Resolves field colors for availability, interaction state, and errors.\n  CarpenterFieldStyle resolve({\n',
              '  CarpenterSelectionStyle resolve({\n': '  /// Resolves selection colors for semantic role, selected state, and interaction state.\n  CarpenterSelectionStyle resolve({\n',
              '  CarpenterFeedbackStyle resolve(FeedbackColorRole role) => _styles[role]!;': '  /// Resolves the feedback style assigned to semantic [role].\n  CarpenterFeedbackStyle resolve(FeedbackColorRole role) => _styles[role]!;',
          }
          for needle, replacement in replacements.items():
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence of {needle!r}, found {count}')
              text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY
          dart format lib/src/foundation/theme.dart
          git rm .github/workflows/document-theme-resolve-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/foundation/theme.dart
          git commit -m "docs: document semantic theme resolvers"
          git push

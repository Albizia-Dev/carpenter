name: Verify DnD Fixes

on:
  push:
    branches:
      - fix/dnd-feedback-and-kanban-dropzones
    paths:
      - .github/workflows/dnd-fix-verify.yml
      - lib/src/components/behaviour/drag_and_drop/draggable.dart
      - lib/src/components/collections/kanban.dart
      - test/collections/advanced_collections_test.dart

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dnd-feedback-and-kanban-dropzones
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format changed surfaces
        run: dart format lib/src/components/behaviour/drag_and_drop/draggable.dart lib/src/components/collections/kanban.dart test/collections/advanced_collections_test.dart
      - name: Commit formatting
        run: |
          git add lib/src/components/behaviour/drag_and_drop/draggable.dart lib/src/components/collections/kanban.dart test/collections/advanced_collections_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: format dnd fixes"
          git push origin HEAD:fix/dnd-feedback-and-kanban-dropzones
      - run: dart analyze lib
      - run: flutter test test/collections/advanced_collections_test.dart

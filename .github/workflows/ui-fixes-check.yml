name: UI Fixes Check

on:
  push:
    branches:
      - widgetbook-ui-fixes

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply token and theme changes
        run: python3 .github/apply_ui_fixes.py

      - name: Generate Mordant tokens
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format
        run: dart format lib test widgetbook/lib

      - name: Commit generated changes
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib widgetbook/lib
            git commit -m "ui: generate token and theme updates [skip ci]"
            git push origin HEAD:widgetbook-ui-fixes
          fi

      - name: Analyze library
        run: dart analyze lib

      - name: Test library
        run: flutter test

      - name: Install Widgetbook dependencies
        working-directory: widgetbook
        run: flutter pub get

      - name: Analyze Widgetbook
        working-directory: widgetbook
        run: flutter analyze

      - name: Build Widgetbook web
        working-directory: widgetbook
        run: flutter build web --release --base-href /carpenter/

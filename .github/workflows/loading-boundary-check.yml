name: Loading Boundary Check

on:
  push:
    branches:
      - loading-boundary
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format loading boundary sources
        run: dart format test/application/loading_test.dart widgetbook/lib/use_cases/behaviour/loading_boundary.dart

      - name: Commit formatting
        shell: bash
        run: |
          git add test/application/loading_test.dart widgetbook/lib/use_cases/behaviour/loading_boundary.dart
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: format loading boundary [skip ci]"
            git push origin HEAD:loading-boundary
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test widgetbook/lib

      - name: Analyze library
        run: dart analyze lib

      - name: Test library
        run: flutter test

      - name: Install Widgetbook dependencies
        working-directory: widgetbook
        run: flutter pub get

      - name: Analyze Widgetbook
        working-directory: widgetbook
        run: flutter analyze

      - name: Build Widgetbook web
        working-directory: widgetbook
        run: flutter build web --release --base-href /carpenter/

name: Patch table resize once

on:
  push:
    branches:
      - fix/table-resize-widgetbook

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/table-resize-widgetbook

      - name: Patch resize behavior
        run: python3 .github/scripts/patch_table_resize.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-table-resize-once.yml .github/scripts/patch_table_resize.py
          git add lib/src/components/collections/table/table.dart lib/src/components/collections/tree/tree_table.dart
          git commit -m "fix: make table column resizing direct and visible"
          git push origin HEAD:fix/table-resize-widgetbook

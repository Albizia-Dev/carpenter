name: Format table changes once

on:
  push:
    branches:
      - feat/table-layout-actions

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/table-layout-actions

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed Dart sources
        run: dart format lib test/collections/table_layout_test.dart test/collections/tree_table_layout_test.dart

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib test/collections/table_layout_test.dart test/collections/tree_table_layout_test.dart
          git commit -m "style: format table layout changes"
          git push origin HEAD:feat/table-layout-actions

name: Widgetbook Playground Check

on:
  push:
    branches:
      - widgetbook-playground

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Install Widgetbook dependencies
        working-directory: widgetbook
        run: flutter pub get

      - name: Format Widgetbook
        run: dart format widgetbook/lib

      - name: Commit formatter changes
        shell: bash
        run: |
          if ! git diff --quiet -- widgetbook/lib; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add widgetbook/lib
            git commit -m "style: format widgetbook playground"
            git push origin HEAD:widgetbook-playground
          fi

      - name: Analyze Widgetbook
        working-directory: widgetbook
        run: flutter analyze

      - name: Build Widgetbook web
        working-directory: widgetbook
        run: flutter build web --release --base-href /carpenter/

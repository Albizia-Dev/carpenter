name: Migration Check

on:
  push:
    branches:
      - migrate-previous-components

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: migrate-previous-components

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Install Widgetbook dependencies
        working-directory: widgetbook
        run: flutter pub get

      - name: Fix migration diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'lib/src/application/host.dart': [
                  ("import 'package:flutter/widgets.dart';", "import 'package:flutter/foundation.dart';\nimport 'package:flutter/widgets.dart';"),
              ],
              'lib/src/page/page.dart': [
                  ('pageController as ValueListenable<CarpenterPageState>', 'pageController'),
              ],
              'lib/src/application/app.dart': [
                  ("import 'runtime/runtime.dart';\n", ''),
              ],
              'lib/src/application/command.dart': [
                  ("import 'package:flutter/services.dart';\n", ''),
              ],
              'lib/src/components/basic/loader.dart': [
                  ("import 'package:carpenter_units/carpenter_units.dart';\n", ''),
              ],
              'lib/src/components/layout/patterns/page_blocks.dart': [
                  ("import '../../../application/command.dart';\n", ''),
              ],
              'lib/src/page/state_boundary.dart': [
                  ("import '../components/basic/button/button.dart';\n", ''),
              ],
              'widgetbook/lib/use_cases/basic/migrated_primitives.dart': [
                  ("""      CarpenterAvatar(\n        child: Icon(CarpenterIcons.account),\n        size: 48,\n        semanticLabel: 'Account',\n      ),""", """      CarpenterAvatar(\n        size: 48,\n        semanticLabel: 'Account',\n        child: Icon(CarpenterIcons.account),\n      ),"""),
              ],
              'widgetbook/lib/use_cases/collections/migrated_collections.dart': [
                  ("""          if (request.cancellation.isCancelled)\n            return CollectionSnapshot<String>.initialLoading();""", """          if (request.cancellation.isCancelled) {\n            return CollectionSnapshot<String>.initialLoading();\n          }"""),
              ],
          }

          for file_name, rules in replacements.items():
              path = Path(file_name)
              text = path.read_text()
              for old, new in rules:
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Format migrated code
        run: dart format lib widgetbook/lib

      - name: Commit automatic fixes
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib widgetbook/lib
            git commit -m "fix: resolve migration analyzer diagnostics"
            git push origin HEAD:migrate-previous-components
          fi

      - name: Analyze library
        run: dart analyze lib

      - name: Analyze Widgetbook
        working-directory: widgetbook
        run: flutter analyze

      - name: Build Widgetbook web
        working-directory: widgetbook
        run: flutter build web --release --base-href /carpenter/

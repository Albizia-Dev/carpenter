name: Verify Advanced Collections

on:
  push:
    branches:
      - feat/file-tree-board-collections
    paths:
      - .github/workflows/advanced-collections-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/file-tree-board-collections
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore unrelated formatting
        run: |
          git checkout origin/develop -- \
            widgetbook/lib/use_cases/basic/extended_primitives.dart \
            widgetbook/lib/use_cases/behaviour/drag_and_drop.dart \
            widgetbook/lib/use_cases/collections/navigation_notifications.dart \
            test/basic/extended_primitives_test.dart \
            test/collections/navigation_notifications_test.dart \
            test/layout/action_overflow_test.dart
      - name: Format changed surfaces
        run: |
          dart format \
            lib/carpenter.dart \
            lib/src/components/basic/input/file_input.dart \
            lib/src/components/behaviour/drag_and_drop/drop_target.dart \
            lib/src/components/collections/reorderable_collection.dart \
            lib/src/components/collections/tree/tree_state.dart \
            lib/src/components/collections/tree/tree_event.dart \
            lib/src/components/collections/tree/tree_view.dart \
            lib/src/components/collections/tree/tree_table.dart \
            lib/src/components/collections/kanban.dart \
            lib/src/components/collections/planning_board.dart \
            widgetbook/lib/use_cases/basic/file_input.dart \
            widgetbook/lib/use_cases/collections/advanced_collections.dart \
            widgetbook/lib/widgetbook.dart \
            test/basic/file_input_test.dart \
            test/collections/advanced_collections_test.dart
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib widgetbook/lib test
          git commit -m "chore: keep advanced collection diff focused"
          git push origin HEAD:feat/file-tree-board-collections
      - run: dart analyze lib
      - run: flutter test test/basic/file_input_test.dart test/collections/advanced_collections_test.dart

# Rerun after providing the reorder test with an overlay host.

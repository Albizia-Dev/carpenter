name: Verify Advanced Collections

on:
  push:
    branches:
      - feat/file-tree-board-collections
    paths:
      - .github/workflows/advanced-collections-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/file-tree-board-collections
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Normalize generic fallback states
        run: |
          sed -i 's/const CarpenterDropTargetState</CarpenterDropTargetState</g' lib/src/components/collections/reorderable_collection.dart
          sed -i 's/const CarpenterDropTargetState</CarpenterDropTargetState</g' lib/src/components/collections/tree/tree_view.dart
          sed -i 's/const CarpenterDropTargetState</CarpenterDropTargetState</g' lib/src/components/collections/kanban.dart
      - run: dart format lib widgetbook/lib test
      - name: Commit mechanical fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib widgetbook/lib test
          git commit -m "style: normalize advanced collection sources"
          git push origin HEAD:feat/file-tree-board-collections
      - run: flutter analyze lib
      - run: flutter test test/basic/file_input_test.dart test/collections/advanced_collections_test.dart

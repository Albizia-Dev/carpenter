name: REM Codemod

on:
  push:
    branches:
      - rem-units
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[rem-codemod]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply rem codemod
        run: python3 .github/scripts/rem_codemod.py

      - name: Regenerate Mordant tokens
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format migrated sources
        run: dart format lib widgetbook/lib example/lib

      - name: Commit migration
        shell: bash
        run: |
          git add lib widgetbook/lib example/lib
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "refactor: resolve UI geometry from rem [rem-codemod]"
            git push origin HEAD:rem-units
          fi

      - name: Check library format
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze library
        run: dart analyze lib

      - name: Test library
        run: flutter test

      - name: Install Widgetbook dependencies
        working-directory: widgetbook
        run: flutter pub get

      - name: Analyze Widgetbook
        working-directory: widgetbook
        run: flutter analyze

      - name: Build Widgetbook web
        working-directory: widgetbook
        run: flutter build web --release --base-href /carpenter/

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Build example web
        working-directory: example
        run: flutter build web --release

name: Source export coverage

on:
  push:
    branches:
      - docs/application-api-coverage-export3

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source
        run: git archive --format=tar HEAD > carpenter-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: carpenter-source
          path: carpenter-source.tar
          retention-days: 1
          if-no-files-found: error

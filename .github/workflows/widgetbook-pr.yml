name: Widgetbook PR check

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'lib/**'
      - 'widgetbook/**'
      - '.github/workflows/widgetbook-pr.yml'

permissions:
  contents: write

jobs:
  widgetbook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Install Widgetbook dependencies
        working-directory: widgetbook
        run: flutter pub get

      - name: Format Widgetbook
        working-directory: widgetbook
        run: dart format lib

      - name: Commit formatting
        run: |
          if ! git diff --quiet -- widgetbook/lib; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add widgetbook/lib
            git commit -m "style: format widgetbook"
            git push
          fi

      - name: Analyze Widgetbook
        working-directory: widgetbook
        run: flutter analyze

      - name: Build Widgetbook Web
        working-directory: widgetbook
        run: flutter build web --release --base-href /carpenter/

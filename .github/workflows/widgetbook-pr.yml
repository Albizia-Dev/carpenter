name: Widgetbook PR check

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'lib/**'
      - 'widgetbook/**'
      - '.github/workflows/widgetbook-pr.yml'

jobs:
  widgetbook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Install Widgetbook dependencies
        working-directory: widgetbook
        run: flutter pub get

      - name: Check Widgetbook code style
        working-directory: widgetbook
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze Widgetbook
        working-directory: widgetbook
        run: flutter analyze

      - name: Build Widgetbook Web
        working-directory: widgetbook
        run: flutter build web --release --base-href /carpenter/

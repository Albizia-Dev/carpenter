name: Documentation
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
permissions:
  contents: write
concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: Verify public API and catalog documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve isolated audit dependencies
        working-directory: tool/documentation
        run: dart pub get --enforce-lockfile
      - name: Check audit formatting and static analysis
        working-directory: tool/documentation
        run: |
          dart format --output=none --set-exit-if-changed bin lib test
          dart analyze
      - name: Test export resolution and regression gates
        working-directory: tool/documentation
        run: dart test
      - name: Refresh resolved documentation debt and release notes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          dart run tool/documentation/bin/audit.dart . --write-baseline
          if ! grep -q '^# 0.3.4$' CHANGELOG.md; then
            cat > /tmp/changelog-0.3.4 <<'EOF'
          # 0.3.4

          - Added semantic `CarpenterLinkRole` variants for inline, standalone,
            subtle, and prominent link presentation.
          - Added independent `CarpenterLinkUnderline` policies with semantic
            automatic defaults and explicit always, hover/focus, or none behavior.
          - Changed the default `CarpenterLink` treatment to neutral standalone
            styling with hover/focus underline while preserving explicit action
            color overrides.
          - Added Widgetbook role coverage and regression tests for link styling,
            focus behavior, activation, and accessibility semantics.

          EOF
            cat CHANGELOG.md >> /tmp/changelog-0.3.4
            mv /tmp/changelog-0.3.4 CHANGELOG.md
          fi
          if ! git diff --quiet -- tool/documentation/coverage-baseline.json CHANGELOG.md; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add tool/documentation/coverage-baseline.json CHANGELOG.md
            git commit -m 'docs: update 0.3.4 release documentation'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Check named documentation debt
        working-directory: tool/documentation
        run: dart run bin/audit.dart ../.. --check
      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f build/documentation/coverage.md ]; then
            cat build/documentation/coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-coverage
          path: build/documentation/
          if-no-files-found: warn
          retention-days: 14
      - name: Resolve library dependencies
        run: flutter pub get
      - name: Generate DartDoc
        run: dart doc --output build/api
      - uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: build/api/
          if-no-files-found: error
          retention-days: 14
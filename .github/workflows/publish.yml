name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  validate-version:
    name: Validate tag version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches pubspec version
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#v}"
          pubspec_version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"

          if [[ -z "$pubspec_version" ]]; then
            echo "Could not read version from pubspec.yaml" >&2
            exit 1
          fi

          if [[ "$tag_version" != "$pubspec_version" ]]; then
            echo "Tag version ($tag_version) does not match pubspec.yaml version ($pubspec_version)" >&2
            exit 1
          fi

          echo "Publishing carpenter $pubspec_version"

  publish:
    name: Publish package
    needs: validate-version
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1

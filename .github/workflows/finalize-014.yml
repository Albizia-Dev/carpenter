name: Finalize 0.1.4

on:
  push:
    branches:
      - fix/project-layout-foundations
    paths:
      - '.github/finalize-014.trigger'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format touched sources
        run: |
          dart format \
            lib/src/components/collections/tree/tree_state.dart \
            lib/src/components/collections/tree/tree_view.dart \
            lib/src/internal/rendering/interactive_region.dart \
            lib/src/page/page.dart \
            widgetbook/lib/widgetbook.dart \
            widgetbook/lib/use_cases/collections/tree_table_contracts.dart \
            test/collections/tree_state_test.dart

      - name: Remove one-shot finalizer
        run: |
          rm -f .github/finalize-014.trigger
          rm -f .github/workflows/finalize-014.yml

      - name: Commit formatting and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add \
            lib/src/components/collections/tree/tree_state.dart \
            lib/src/components/collections/tree/tree_view.dart \
            lib/src/internal/rendering/interactive_region.dart \
            lib/src/page/page.dart \
            widgetbook/lib/widgetbook.dart \
            widgetbook/lib/use_cases/collections/tree_table_contracts.dart \
            test/collections/tree_state_test.dart
          git add -u .github/finalize-014.trigger .github/workflows/finalize-014.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style: format 0.1.4 sources"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

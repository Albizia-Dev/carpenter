name: Format repaired theme branch once

on:
  push:
    branches:
      - refactor/theme-composition

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/theme-composition
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/src/foundation/theme.dart test/foundation/theme_composition_test.dart
          git rm .github/workflows/format-theme-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/foundation/theme.dart test/foundation/theme_composition_test.dart
          git commit -m "style: format semantic theme composition"
          git push

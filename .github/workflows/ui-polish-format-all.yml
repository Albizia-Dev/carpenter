name: UI polish format all

on:
  push:
    branches:
      - fix/ui-component-polish

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve package dependencies
        run: flutter pub get

      - name: Format every path enforced by Build
        run: dart format lib test widgetbook/lib widgetbook/test example/lib

      - name: Remove one-off formatter and commit
        run: |
          rm .github/workflows/ui-polish-format-all.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test widgetbook/lib widgetbook/test example/lib .github/workflows/ui-polish-format-all.yml
          git commit -m "chore: format ui polish changes"
          git push

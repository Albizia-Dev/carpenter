name: Verify Gravity icons

on:
  push:
    branches:
      - feat/gravity-icons

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install package dependencies
        run: flutter pub get
      - name: Verify generated icon catalog
        run: |
          cp lib/src/components/basic/gravity_icons.g.dart /tmp/gravity_icons.g.dart
          dart run tool/generate_gravity_icons.dart
          diff -u /tmp/gravity_icons.g.dart lib/src/components/basic/gravity_icons.g.dart
      - name: Analyze library
        run: dart analyze lib
      - name: Install Widgetbook dependencies
        working-directory: widgetbook
        run: flutter pub get
      - name: Format Widgetbook
        run: dart format widgetbook/lib
      - name: Analyze Widgetbook
        working-directory: widgetbook
        run: dart analyze lib
      - name: Build Widgetbook web
        working-directory: widgetbook
        run: flutter build web --release --base-href /carpenter/
      - name: Commit formatting
        run: |
          git add widgetbook/lib/use_cases/foundation/gravity_icons.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Gravity icons Widgetbook catalog"
          git push

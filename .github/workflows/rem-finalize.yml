name: REM Finalize

on:
  push:
    branches:
      - rem-units
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[rem-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: rem-units

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Finalize rem migration
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          def rem_value(px):
              value = float(px) / 16.0
              text = f'{value:.6f}'.rstrip('0').rstrip('.')
              if text.startswith('0.'):
                  text = text[1:]
              elif text.startswith('-0.'):
                  text = '-' + text[2:]
              return text or '0'

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def patch(path, fn):
              p = Path(path)
              old = p.read_text(encoding='utf-8')
              new = fn(old)
              if new != old:
                  write(path, new)

          # Design-token geometry is root-relative, including focus and borders.
          for p in Path('lib/src/foundation/tokens').glob('*.yaml'):
              text = p.read_text(encoding='utf-8')
              text = re.sub(
                  r'(?<![\w.])(-?\d+(?:\.\d+)?)px\b',
                  lambda m: f'{rem_value(m.group(1))}rem',
                  text,
              )
              p.write_text(text, encoding='utf-8')

          # Breakpoints and positioned geometry are rem-resolved at runtime.
          for root in [Path('lib'), Path('widgetbook/lib'), Path('example/lib')]:
              for p in root.rglob('*.dart'):
                  if p.name.endswith('.g.dart'):
                      continue
                  text = p.read_text(encoding='utf-8')
                  text = re.sub(
                      r'(constraints\.(?:maxWidth|maxHeight)\s*[<>]=?\s*)([1-9]\d*(?:\.\d+)?)',
                      lambda m: f'{m.group(1)}context.units({rem_value(m.group(2))}.rem)',
                      text,
                  )
                  text = re.sub(
                      r'\b(left|right|top|bottom)\s*:\s*([1-9]\d*(?:\.\d+)?)\b',
                      lambda m: f'{m.group(1)}: context.units({rem_value(m.group(2))}.rem)',
                      text,
                  )
                  p.write_text(text, encoding='utf-8')

          patch('lib/src/components/basic/loader.dart', lambda t: t
              .replace('this.strokeWidth = 2.5,', 'this.strokeWidth = const Rem(.15625),')
              .replace('final double strokeWidth;\n  final String semanticLabel;', 'final LengthUnit strokeWidth;\n  final String semanticLabel;')
              .replace('final extent = context.units(widget.size);', 'final extent = context.units(widget.size);\n    final strokeWidth = context.units(widget.strokeWidth);')
              .replace('strokeWidth: widget.strokeWidth,', 'strokeWidth: strokeWidth,'))

          def collection_search(t):
              if "package:carpenter_units/carpenter_units.dart" not in t:
                  t = "import 'package:carpenter_units/carpenter_units.dart';\n" + t
              t = t.replace('this.width = 520,', 'this.width = const Rem(32.5),')
              t = t.replace('final double width;', 'final LengthUnit width;')
              t = t.replace('Widget build(BuildContext context) => SizedBox(\n    width: widget.width,', 'Widget build(BuildContext context) => SizedBox(\n    width: context.units(widget.width),')
              return t
          patch('lib/src/components/collections/collection_search_field.dart', collection_search)

          def page_blocks(t):
              t = t.replace('this.compactBreakpoint = 640,', 'this.compactBreakpoint = const Rem(40),')
              t = t.replace('final double compactBreakpoint;', 'final LengthUnit compactBreakpoint;')
              t = t.replace(
                  'final gap = context.units(CarpenterTheme.of(context).spacing.small);\n    return LayoutBuilder(\n      builder: (context, constraints) => Wrap(\n        alignment: constraints.maxWidth < compactBreakpoint',
                  'final gap = context.units(CarpenterTheme.of(context).spacing.small);\n    final compactBreakpoint = context.units(this.compactBreakpoint);\n    return LayoutBuilder(\n      builder: (context, constraints) => Wrap(\n        alignment: constraints.maxWidth < compactBreakpoint',
              )
              t = t.replace('this.width = 180,', 'this.width = const Rem(11.25),')
              # This is the only public width field in this file.
              t = t.replace('final Widget child;\n  final double width;', 'final Widget child;\n  final LengthUnit width;')
              t = t.replace(
                  'Widget build(BuildContext context) => LayoutBuilder(\n    builder: (context, constraints) => SizedBox(\n      width: constraints.maxWidth.isFinite\n          ? width.clamp(0, constraints.maxWidth).toDouble()\n          : width,',
                  'Widget build(BuildContext context) {\n    final width = context.units(this.width);\n    return LayoutBuilder(\n      builder: (context, constraints) => SizedBox(\n        width: constraints.maxWidth.isFinite\n            ? width.clamp(0, constraints.maxWidth).toDouble()\n            : width,',
              )
              t = t.replace('      child: child,\n    ),\n  );\n}\n\nfinal class CarpenterCollectionGroupHeader', '        child: child,\n      ),\n    );\n  }\n}\n\nfinal class CarpenterCollectionGroupHeader')
              return t
          patch('lib/src/components/layout/patterns/page_blocks.dart', page_blocks)

          patch('lib/src/components/basic/checkbox.dart', lambda t: t.replace('context.units(const Px(2))', 'context.units(const Rem(.125))'))
          patch('lib/src/components/basic/link.dart', lambda t: t.replace('context.units(const Px(3))', 'context.units(const Rem(.1875))'))
          patch('lib/src/components/collections/table/table.dart', lambda t: t.replace('onWidthChanged!(column.id, Px(value))', 'onWidthChanged!(column.id, Rem(value / context.units(1.rem)))'))

          # Widgetbook viewport helpers are expressed in rem; only ViewportAddon metadata stays logical pixels.
          layout_path = Path('widgetbook/lib/helpers/layout_viewport.dart')
          t = layout_path.read_text(encoding='utf-8')
          for px in [390, 844, 768, 1024, 1280, 800, 1920, 1080, 720]:
              t = t.replace(f'const Px({px})', f'const Rem({rem_value(px)})')
          t = t.replace('Widget layoutViewportFrame({', 'Widget layoutViewportFrame(\n  BuildContext context, {')
          t = t.replace('return layoutViewportFrame(\n    preset:', 'return layoutViewportFrame(\n    context,\n    preset:')
          t = t.replace('height: offHeight.value,', 'height: context.units(offHeight),')
          t = t.replace('width: dimensions.$1.value,', 'width: context.units(dimensions.$1),')
          t = t.replace('height: dimensions.$2.value,', 'height: context.units(dimensions.$2),')
          layout_path.write_text(t, encoding='utf-8')

          # Direct frame calls now pass their local BuildContext and use rem heights.
          for p in Path('widgetbook/lib').rglob('*.dart'):
              if p == layout_path:
                  continue
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'layoutViewportFrame\(\n(\s*)preset:', r'layoutViewportFrame(\n\1context,\n\1preset:', text)
              text = re.sub(
                  r'offHeight:\s*const Px\((\d+(?:\.\d+)?)\)',
                  lambda m: f'offHeight: const Rem({rem_value(m.group(1))})',
                  text,
              )
              p.write_text(text, encoding='utf-8')

          patch('widgetbook/lib/use_cases/collections/data_list.dart', lambda t: t.replace('height: const Px(520).value,', 'height: context.units(32.5.rem),'))

          # Preview root must resolve padding below UnitsRoot.
          def addons(t):
              old = """builder: (context, child) => UnitsRoot(\n      rem: const Px(16),\n      child: Padding(padding: const EdgeInsets.all(24), child: child),\n    ),"""
              new = """builder: (context, child) => UnitsRoot(\n      rem: const Px(16),\n      child: Builder(\n        builder: (context) => Padding(\n          padding: EdgeInsets.all(context.units(1.5.rem)),\n          child: child,\n        ),\n      ),\n    ),"""
              return t.replace(old, new)
          patch('widgetbook/lib/addons/carpenter_addons.dart', addons)

          # Migrated primitives expose rem knobs and pass LengthUnit APIs directly.
          def primitives(t):
              replacements = {
                  "label: 'Progress · Width',\n    initialValue: 320,\n    min: 80,\n    max: 720,": "label: 'Progress · Width (rem)',\n    initialValue: 20,\n    min: 5,\n    max: 45,",
                  "label: 'Progress · Height',\n    initialValue: 4,\n    min: 2,\n    max: 16,": "label: 'Progress · Height (rem)',\n    initialValue: .25,\n    min: .125,\n    max: 1,",
                  "label: 'Loader · Size',\n    initialValue: 24,\n    min: 12,\n    max: 64,": "label: 'Loader · Size (rem)',\n    initialValue: 1.5,\n    min: .75,\n    max: 4,",
                  "label: 'Loader · Stroke',\n    initialValue: 2.5,\n    min: 1,\n    max: 8,": "label: 'Loader · Stroke (rem)',\n    initialValue: .15625,\n    min: .0625,\n    max: .5,",
                  "if (showLoader) CarpenterLoader(size: loaderSize, strokeWidth: strokeWidth),": "if (showLoader) CarpenterLoader(size: loaderSize.rem, strokeWidth: strokeWidth.rem),",
                  "width: width,\n      child: CarpenterProgress(\n        value: value,\n        height: height,": "width: context.units(width.rem),\n      child: CarpenterProgress(\n        value: value,\n        height: height.rem,",
                  "CarpenterLoader(size: 12, strokeWidth: 1.5)": "CarpenterLoader(size: const Rem(.75), strokeWidth: const Rem(.09375))",
                  "CarpenterLoader(size: 16, strokeWidth: 2)": "CarpenterLoader(size: const Rem(1), strokeWidth: const Rem(.125))",
                  "CarpenterLoader(size: 24, strokeWidth: 2.5)": "CarpenterLoader(size: const Rem(1.5), strokeWidth: const Rem(.15625))",
                  "CarpenterLoader(size: 32, strokeWidth: 3)": "CarpenterLoader(size: const Rem(2), strokeWidth: const Rem(.1875))",
                  "CarpenterLoader(size: 48, strokeWidth: 4)": "CarpenterLoader(size: const Rem(3), strokeWidth: const Rem(.25))",
                  "height: context.units(.125.rem)": "height: const Rem(.125)",
                  "height: context.units(.25.rem)": "height: const Rem(.25)",
                  "height: context.units(.5.rem)": "height: const Rem(.5)",
                  "label: 'Appearance · Palette height',\n    initialValue: 160,\n    min: 80,\n    max: 320,": "label: 'Appearance · Palette height (rem)',\n    initialValue: 10,\n    min: 5,\n    max: 20,",
                  "label: 'Appearance · Width',\n    initialValue: 620,\n    min: 280,\n    max: 900,": "label: 'Appearance · Width (rem)',\n    initialValue: 38.75,\n    min: 17.5,\n    max: 56.25,",
                  "paletteHeight: paletteHeight,\n    width: width,": "paletteHeight: paletteHeight.rem,\n    width: width.rem,",
                  "final double paletteHeight;\n  final double width;": "final LengthUnit paletteHeight;\n  final LengthUnit width;",
                  "width: widget.width,": "width: context.units(widget.width),",
                  "paletteHeight: widget.paletteHeight,": "paletteHeight: widget.paletteHeight,",
              }
              for old, new in replacements.items():
                  t = t.replace(old, new)
              # Avatar literal sizes are LengthUnit as well.
              t = re.sub(r'size:\s*(24|32|40|48|64|96),', lambda m: f'size: const Rem({rem_value(m.group(1))}),', t)
              return t
          patch('widgetbook/lib/use_cases/basic/migrated_primitives.dart', primitives)

          # Remove redundant direct unit imports where Carpenter already exports the package.
          for root in [Path('widgetbook/lib'), Path('example/lib')]:
              for p in root.rglob('*.dart'):
                  text = p.read_text(encoding='utf-8')
                  if "package:carpenter/carpenter.dart" in text:
                      text = text.replace("import 'package:carpenter_units/carpenter_units.dart';\n", '')
                  p.write_text(text, encoding='utf-8')

          # Remove const only from constructor/list scopes that now contain runtime rem resolution.
          def matching(text, start):
              pairs = {'(': ')', '[': ']', '{': '}'}
              opener = text[start]
              closer = pairs[opener]
              depth = 0
              quote = None
              escape = False
              i = start
              while i < len(text):
                  ch = text[i]
                  if quote:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch in "'\"":
                      quote = ch
                      i += 1
                      continue
                  if ch == opener:
                      depth += 1
                  elif ch == closer:
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              return None

          const_re = re.compile(r'\bconst\s+(?=(?:[A-Za-z_][\w.<>?, ]*\s*)?[\(\[\{])')
          for root in [Path('lib'), Path('widgetbook/lib'), Path('example/lib')]:
              for p in root.rglob('*.dart'):
                  if p.name.endswith('.g.dart'):
                      continue
                  text = p.read_text(encoding='utf-8')
                  changed = True
                  while changed:
                      changed = False
                      for m in list(const_re.finditer(text)):
                          open_positions = [pos for pos in (text.find('(', m.end()), text.find('[', m.end()), text.find('{', m.end())) if pos >= 0]
                          if not open_positions:
                              continue
                          start = min(open_positions)
                          end = matching(text, start)
                          if end is None:
                              continue
                          region = text[m.start():end + 1]
                          if 'context.units(' in region:
                              text = text[:m.start()] + text[m.end():]
                              changed = True
                              break
                  p.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate tokens
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format
        run: dart format lib widgetbook/lib example/lib

      - name: Commit migration
        shell: bash
        run: |
          git add lib widgetbook/lib example/lib
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "refactor: finish rem unit migration [rem-finalize]"
            git push origin HEAD:rem-units
          fi

      - name: Analyze library
        run: dart analyze lib

      - name: Test library
        run: flutter test

      - name: Install Widgetbook dependencies
        working-directory: widgetbook
        run: flutter pub get

      - name: Analyze Widgetbook
        working-directory: widgetbook
        run: flutter analyze

      - name: Build Widgetbook
        working-directory: widgetbook
        run: flutter build web --release --base-href /carpenter/

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Build example
        working-directory: example
        run: flutter build web --release

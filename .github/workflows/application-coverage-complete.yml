name: Verify remaining application documentation

on:
  push:
    branches:
      - docs/application-api-coverage-complete

permissions:
  contents: write

concurrency:
  group: application-coverage-complete
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore documented application sources
        run: base64 -d .tmp/application-rest.tar.gz.b64 | tar -xz -C .
      - name: Resolve dependencies
        run: |
          flutter pub get
          (cd widgetbook && flutter pub get)
          (cd tool/documentation && dart pub get --enforce-lockfile)
      - name: Format documented application sources
        run: |
          dart format \
            lib/src/application/app.dart \
            lib/src/application/command_input_button.dart \
            lib/src/application/frame_shell.dart \
            lib/src/application/hotkey_shell.dart \
            lib/src/application/module/module.dart \
            lib/src/application/navigation/route.dart \
            lib/src/application/navigation/route_information_sync.dart \
            lib/src/application/navigation/router.dart \
            lib/src/application/navigation/router_shell.dart \
            lib/src/application/shell/shell.dart
      - name: Regenerate documentation debt ledger
        run: (cd tool/documentation && dart run bin/audit.dart ../.. --write-baseline)
      - name: Verify documentation tooling
        run: |
          (cd tool/documentation && dart test)
          (cd tool/documentation && dart run bin/audit.dart ../.. --check)
      - name: Analyze library and Widgetbook
        run: |
          dart analyze lib
          (cd widgetbook && dart analyze lib test)
      - name: Test application contracts
        run: |
          flutter test test/application test/foundation/application_test.dart
          (cd widgetbook && flutter test test/widgetbook_smoke_test.dart)
      - name: Commit verified result and remove workbench
        run: |
          rm -f .github/workflows/application-coverage-complete.yml .tmp/application-rest.tar.gz.b64
          rmdir .tmp 2>/dev/null || true
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'docs: complete application API coverage'
          git push origin HEAD:docs/application-api-coverage-complete

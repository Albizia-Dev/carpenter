name: Overlay Fix Check

on:
  push:
    branches:
      - fix-application-overlay
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/src/application/app.dart test/application/carpenter_app_overlay_test.dart

      - name: Analyze fix
        run: dart analyze lib/src/application/app.dart test/application/carpenter_app_overlay_test.dart

      - name: Test overlay regression
        run: flutter test test/application/carpenter_app_overlay_test.dart

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Build example web
        working-directory: example
        run: flutter build web --release

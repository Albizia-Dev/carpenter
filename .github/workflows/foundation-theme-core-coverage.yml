name: Verify foundation theme core documentation

on:
  push:
    branches:
      - docs/foundation-theme-core-coverage

permissions:
  contents: write

concurrency:
  group: foundation-theme-core-coverage
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore documented theme source
        run: |
          printf '%s  %s\n' 'f50999c4df090e474f7b985732d50861511dd7e9603c1246d11533a7ad03cff7' '.tmp/theme-core.dart.gz.b64' | sha256sum -c -
          base64 -d .tmp/theme-core.dart.gz.b64 | gzip -d > lib/src/foundation/theme.dart
          printf '%s  %s\n' 'ce34a3c3d693b7493c5aeb867b06088130853ab939d1208556811a95c6eb9fc6' 'lib/src/foundation/theme.dart' | sha256sum -c -
      - name: Resolve dependencies
        run: |
          flutter pub get
          (cd widgetbook && flutter pub get)
          (cd tool/documentation && dart pub get --enforce-lockfile)
      - name: Format theme source
        run: dart format lib/src/foundation/theme.dart
      - name: Regenerate documentation debt ledger
        run: (cd tool/documentation && dart run bin/audit.dart ../.. --write-baseline)
      - name: Verify documentation tooling
        run: |
          (cd tool/documentation && dart test)
          (cd tool/documentation && dart run bin/audit.dart ../.. --check)
      - name: Analyze library and Widgetbook
        run: |
          dart analyze lib
          (cd widgetbook && dart analyze lib test)
      - name: Test theme contracts
        run: |
          flutter test test/foundation/theme_test.dart test/foundation/action_descriptor_test.dart
          (cd widgetbook && flutter test test/widgetbook_smoke_test.dart)
      - name: Commit verified result and remove workbench
        run: |
          rm -f .github/workflows/foundation-theme-core-coverage.yml .tmp/theme-core.dart.gz.b64
          rmdir .tmp 2>/dev/null || true
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'docs: cover semantic theme core contracts'
          git push origin HEAD:docs/foundation-theme-core-coverage

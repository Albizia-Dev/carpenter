name: Verify command documentation tranche

on:
  push:
    branches:
      - docs/application-api-coverage

permissions:
  contents: write

concurrency:
  group: command-doc-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore documented command source
        run: base64 -d .tmp/command.dart.gz.b64 | gzip -d > lib/src/application/command.dart
      - name: Resolve dependencies
        run: |
          flutter pub get
          (cd widgetbook && flutter pub get)
          (cd tool/documentation && dart pub get --enforce-lockfile)
      - name: Format command source
        run: dart format lib/src/application/command.dart
      - name: Regenerate documentation debt ledger
        run: (cd tool/documentation && dart run bin/audit.dart ../.. --write-baseline)
      - name: Verify documentation tooling
        run: |
          (cd tool/documentation && dart test)
          (cd tool/documentation && dart run bin/audit.dart ../.. --check)
      - name: Analyze library and Widgetbook
        run: |
          dart analyze lib
          (cd widgetbook && dart analyze lib test)
      - name: Test command contracts and catalog
        run: |
          flutter test \
            test/application/command_action_projection_test.dart \
            test/application/command_execution_test.dart \
            test/application/command_policy_test.dart
          (cd widgetbook && flutter test test/widgetbook_smoke_test.dart)
      - name: Commit verified result and remove workbench
        run: |
          rm -f .github/workflows/command-doc-repair.yml .tmp/command.dart.gz.b64
          rmdir .tmp 2>/dev/null || true
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'docs: cover command application contracts'
          git push origin HEAD:docs/application-api-coverage

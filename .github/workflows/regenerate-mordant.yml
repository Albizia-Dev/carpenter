name: Regenerate Mordant tokens

on:
  push:
    branches:
      - fix/project-layout-foundations
    paths:
      - 'lib/src/foundation/tokens/*.mordant.yaml'
      - 'lib/src/foundation/tokens/*.mordant.part.yaml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Mordant tokens
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Commit generated tokens
        shell: bash
        run: |
          set -euo pipefail
          git add lib/src/foundation/tokens/carpenter.mordant.g.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(tokens): regenerate Mordant output"
          git push origin HEAD:${GITHUB_REF_NAME}

name: Validate table interactions once

on:
  push:
    branches:
      - feat/table-layout-actions

jobs:
  table-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze changed table sources
        run: >-
          dart analyze
          lib/carpenter.dart
          lib/src/components/layout/toolbar.dart
          lib/src/components/collections/table/table.dart
          lib/src/components/collections/table/table_actions.dart
          lib/src/components/collections/table/table_column.dart
          lib/src/components/collections/table/table_text.dart
          lib/src/components/collections/tree/tree_table.dart

      - name: Run focused table tests
        run: flutter test test/collections/table_layout_test.dart test/collections/tree_table_layout_test.dart

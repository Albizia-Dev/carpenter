name: Verify application documentation tranche

on:
  push:
    branches:
      - docs/application-api-coverage

permissions:
  contents: write

concurrency:
  group: application-doc-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: |
          flutter pub get
          (cd widgetbook && flutter pub get)
          (cd tool/documentation && dart pub get --enforce-lockfile)
      - name: Format changed Dart sources
        run: |
          dart format \
            lib/src/application/command_policy.dart \
            lib/src/application/hotkey.dart \
            lib/src/application/host.dart \
            lib/src/application/runtime/runtime.dart \
            lib/src/foundation/application.dart \
            widgetbook/lib/catalog.dart \
            widgetbook/lib/use_cases/application/runtime_commands.dart \
            widgetbook/test/widgetbook_smoke_test.dart
      - name: Regenerate documentation debt ledger
        run: (cd tool/documentation && dart run bin/audit.dart ../.. --write-baseline)
      - name: Verify documentation tooling
        run: |
          (cd tool/documentation && dart test)
          (cd tool/documentation && dart run bin/audit.dart ../.. --check)
      - name: Analyze library and Widgetbook
        run: |
          flutter analyze
          (cd widgetbook && flutter analyze)
      - name: Test catalog structure
        run: (cd widgetbook && flutter test test/widgetbook_smoke_test.dart)
      - name: Commit verified result and remove workbench
        run: |
          rm .github/workflows/application-doc-repair.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'docs: format and record application coverage'
          git push origin HEAD:docs/application-api-coverage

name: Cut Carpenter v0.2.1

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/release-v0.2.1.yml'

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release target
        uses: actions/checkout@v4
        with:
          ref: 191bb5e4c2be758718be88fb6bc1f6f33525bcd1

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(awk '/^version:/ { print $2; exit }' pubspec.yaml)" = "0.2.1"
          grep -q '^# 0\.2\.1$' CHANGELOG.md

      - name: Create v0.2.1 tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target='191bb5e4c2be758718be88fb6bc1f6f33525bcd1'
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"

          status="$(curl -sS -o /tmp/ref.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$api/git/ref/tags/v0.2.1")"

          if [ "$status" = 200 ]; then
            existing="$(jq -r '.object.sha' /tmp/ref.json)"
            test "$existing" = "$target"
          elif [ "$status" = 404 ]; then
            jq -n --arg ref 'refs/tags/v0.2.1' --arg sha "$target" \
              '{ref:$ref, sha:$sha}' >/tmp/create-ref.json
            curl --fail-with-body -sS -L -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'Content-Type: application/json' \
              "$api/git/refs" \
              --data-binary @/tmp/create-ref.json
          else
            cat /tmp/ref.json
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          status="$(curl -sS -o /tmp/release.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$api/releases/tags/v0.2.1")"

          if [ "$status" = 404 ]; then
            body=$(cat <<'EOF'
          Carpenter 0.2.1 adds adaptive contextual actions and stabilizes table action geometry across pointer and touch input.

          - Secondary pointer press and touch long-press now invoke the same semantic `CarpenterActionDescriptor` set.
          - Table and tree-table action lanes stay pinned to the trailing edge while data columns scroll underneath.
          - Existing table/tree action builders are reused for inline, overflow, and contextual presentation without duplicate application action definitions.
          - Legacy tree-table action shorthands remain source-compatible.
          EOF
          )
            jq -n \
              --arg tag_name 'v0.2.1' \
              --arg target_commitish '191bb5e4c2be758718be88fb6bc1f6f33525bcd1' \
              --arg name 'v0.2.1' \
              --arg body "$body" \
              '{tag_name:$tag_name,target_commitish:$target_commitish,name:$name,body:$body,draft:false,prerelease:false}' \
              >/tmp/create-release.json
            curl --fail-with-body -sS -L -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'Content-Type: application/json' \
              "$api/releases" \
              --data-binary @/tmp/create-release.json
          elif [ "$status" != 200 ]; then
            cat /tmp/release.json
            exit 1
          fi

      - name: Dispatch pub.dev publishing on tag ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          printf '%s\n' '{"ref":"v0.2.1"}' >/tmp/dispatch.json
          curl --fail-with-body -sS -L -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            "$api/actions/workflows/publish.yml/dispatches" \
            --data-binary @/tmp/dispatch.json

name: Build

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  web:
    name: Verify package and build web examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Commit canonical formatting
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- lib test; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib test
          git commit -m "style: format Dart sources"
          git push origin HEAD:${{ github.head_ref }}

      - name: Analyze library
        run: dart analyze lib

      - name: Test package without goldens
        shell: bash
        run: |
          mapfile -t tests < <(find test -name '*_test.dart' -not -path 'test/goldens/*' -print | sort)
          flutter test "${tests[@]}"

      - name: Install Widgetbook dependencies
        working-directory: widgetbook
        run: flutter pub get

      - name: Build Widgetbook
        working-directory: widgetbook
        run: flutter build web --release --base-href /carpenter/

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build example
        working-directory: example
        run: flutter build web --release

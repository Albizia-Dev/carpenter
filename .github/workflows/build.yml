name: Build

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-request-lifecycle:
    name: Format request lifecycle once
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format lifecycle controller
        run: dart format lib/src/components/collections/contracts/collection_lifecycle_controller.dart

      - name: Guard scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "lib/src/components/collections/contracts/collection_lifecycle_controller.dart"

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/components/collections/contracts/collection_lifecycle_controller.dart
          git commit -m "style: format collection request lifecycle"
          git push

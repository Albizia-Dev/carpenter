name: Build

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-command-policy:
    name: Format command policy once
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Format policy files
        run: >-
          dart format
          lib/src/application/command_policy.dart
          test/application/command_policy_test.dart

      - name: Discard dependency-tool side effects
        shell: bash
        run: |
          git restore analysis_options.yaml 2>/dev/null || true
          git restore example/pubspec.lock 2>/dev/null || true

      - name: Guard scope
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' lib/src/application/command_policy.dart test/application/command_policy_test.dart | sort)"
          test "$changed" = "$expected"

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/application/command_policy.dart test/application/command_policy_test.dart
          git commit -m "style: format command execution policies"
          git push

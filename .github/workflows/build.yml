name: Build

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    name: Apply density token migration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply guarded density migration
        run: python3 .github/scripts/apply_density_migration.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate Mordant tokens
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format changed Dart
        run: dart format lib/src/foundation/theme.dart test/foundation/theme_test.dart

      - name: Guard migration scope
        shell: bash
        run: |
          allowed='^(lib/src/foundation/theme.dart|lib/src/foundation/tokens/components.mordant.part.yaml|lib/src/foundation/tokens/carpenter.mordant.g.dart|test/foundation/theme_test.dart)$'
          unexpected=$(git status --short | awk '{print $2}' | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated/modified paths:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check

      - name: Commit density migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/src/foundation/theme.dart \
                  lib/src/foundation/tokens/components.mordant.part.yaml \
                  lib/src/foundation/tokens/carpenter.mordant.g.dart \
                  test/foundation/theme_test.dart
          git commit -m 'refactor: make compact density systemic'
          git push origin HEAD:${{ github.head_ref }}

name: Build

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Verify package and build web examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format existing Widgetbook sources
        run: >-
          dart format
          widgetbook/lib/use_cases/basic/extended_primitives.dart
          widgetbook/lib/use_cases/behaviour/drag_and_drop.dart
          widgetbook/lib/use_cases/collections/navigation_notifications.dart

      - name: Commit formatted sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Formatter produced no changes"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add widgetbook/lib/use_cases/basic/extended_primitives.dart \
            widgetbook/lib/use_cases/behaviour/drag_and_drop.dart \
            widgetbook/lib/use_cases/collections/navigation_notifications.dart
          git commit -m "style: format Widgetbook sources"
          git push origin HEAD:${{ github.head_ref }}

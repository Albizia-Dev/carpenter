name: Build

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    name: Apply action visibility migration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply guarded action visibility migration
        run: python3 .github/scripts/apply_action_visibility.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed files
        run: >-
          dart format
          lib/src/foundation/roles.dart
          lib/src/application/command.dart
          lib/src/components/behaviour/action_strip.dart
          lib/src/components/behaviour/menu/menu.dart
          lib/src/internal/selection/menu_panel.dart
          lib/src/internal/rendering/action_control.dart
          lib/src/components/basic/button/button.dart
          lib/src/components/basic/button/icon_button.dart
          test/foundation/action_descriptor_test.dart
          test/application/command_action_projection_test.dart
          test/behaviour/action_visibility_test.dart

      - name: Discard dependency-tool side effects
        run: git checkout -- analysis_options.yaml example/pubspec.lock

      - name: Guard migration scope
        shell: bash
        run: |
          allowed='^(lib/src/foundation/roles.dart|lib/src/application/command.dart|lib/src/components/behaviour/action_strip.dart|lib/src/components/behaviour/menu/menu.dart|lib/src/internal/selection/menu_panel.dart|lib/src/internal/rendering/action_control.dart|lib/src/components/basic/button/button.dart|lib/src/components/basic/button/icon_button.dart|test/foundation/action_descriptor_test.dart|test/application/command_action_projection_test.dart|test/behaviour/action_visibility_test.dart)$'
          unexpected=$(git status --short | awk '{print $2}' | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected modified paths:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check

      - name: Commit migration and formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/src/foundation/roles.dart \
                  lib/src/application/command.dart \
                  lib/src/components/behaviour/action_strip.dart \
                  lib/src/components/behaviour/menu/menu.dart \
                  lib/src/internal/selection/menu_panel.dart \
                  lib/src/internal/rendering/action_control.dart \
                  lib/src/components/basic/button/button.dart \
                  lib/src/components/basic/button/icon_button.dart \
                  test/foundation/action_descriptor_test.dart \
                  test/application/command_action_projection_test.dart \
                  test/behaviour/action_visibility_test.dart
          git commit -m 'refactor: make action visibility logical'
          git push origin HEAD:${{ github.head_ref }}

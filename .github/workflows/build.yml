name: Build

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  web:
    name: Verify package and build web examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply shared table cell chrome
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          def dec(value):
              return base64.b64decode(value).decode()

          table = Path('lib/src/components/collections/table/table.dart')
          text = table.read_text()
          old = "import '../../../internal/rendering/interactive_region.dart';\n"
          if text.count(old) != 1:
              raise SystemExit(f'table import match count={text.count(old)}')
          text = text.replace(old, '', 1)
          old = "import 'table_actions.dart';\nimport 'table_column.dart';"
          new = "import 'table_actions.dart';\nimport 'table_cell.dart';\nimport 'table_column.dart';"
          if text.count(old) != 1:
              raise SystemExit(f'table cell import match count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = dec('')
          new = dec('ICAgICAgICAgICAgICBtdWx0aVNvcnQ6IHdpZGdldC5tdWx0aVNvcnQsCiAgICAgICAgICAgICAgb25XaWR0aENoYW5nZWQ6IF9yZXNpemVDb2x1bW4sCg==')
          if text.count(old) != 1:
              raise SystemExit(f'header call match count={text.count(old)}')
          text = text.replace(old, new, 1)
          start = text.index('final class _HeaderCell<T> extends StatelessWidget {')
          end = text.index('final class _TableRow<T, K> extends StatefulWidget {')
          header = dec('')
          text = text[:start] + header + text[end:]
          old = dec('')
          new = dec('')
          if text.count(old) != 1:
              raise SystemExit(f'row cell match count={text.count(old)}')
          table.write_text(text.replace(old, new, 1))

          tree = Path('lib/src/components/collections/tree/tree_table.dart')
          text = tree.read_text()
          old = "import '../table/table_actions.dart';\nimport '../table/table_column.dart';"
          new = "import '../table/table_actions.dart';\nimport '../table/table_cell.dart';\nimport '../table/table_column.dart';"
          if text.count(old) != 1:
              raise SystemExit(f'tree cell import match count={text.count(old)}')
          text = text.replace(old, new, 1)
          start = text.index('final class _TreeHeaderCell extends StatelessWidget {')
          end = text.index('final class _TreeTablePrefix<T> extends StatelessWidget {')
          tree_block = dec('')
          tree.write_text(text[:start] + tree_block + text[end:])
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Format shared table cell chrome
        run: dart format lib/src/components/collections/table/table_cell.dart lib/src/components/collections/table/table.dart lib/src/components/collections/tree/tree_table.dart

      - name: Commit shared table cell chrome
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/components/collections/table/table_cell.dart lib/src/components/collections/table/table.dart lib/src/components/collections/tree/tree_table.dart
          git commit -m "refactor: consume shared table cell chrome"
          git push origin HEAD:${{ github.head_ref }}

      - name: Analyze library
        run: dart analyze lib

      - name: Test package without goldens
        shell: bash
        run: |
          mapfile -t tests < <(find test -name '*_test.dart' -not -path 'test/goldens/*' -print | sort)
          flutter test "${tests[@]}"

      - name: Install Widgetbook dependencies
        working-directory: widgetbook
        run: flutter pub get

      - name: Build Widgetbook
        working-directory: widgetbook
        run: flutter build web --release --base-href /carpenter/

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build example
        working-directory: example
        run: flutter build web --release

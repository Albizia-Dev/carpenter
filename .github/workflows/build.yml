name: Build

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    name: Apply semantic surface migration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply guarded FileDropZone migration
        run: python3 .github/scripts/apply_semantic_surface_migration.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed files
        run: >-
          dart format
          lib/src/components/basic/card.dart
          lib/src/components/basic/icon.dart
          lib/src/components/basic/text.dart
          lib/src/components/basic/input/file_input.dart
          lib/src/components/behaviour/notice.dart
          test/basic/semantic_surface_test.dart
          widgetbook/lib/use_cases/basic/card_link.dart

      - name: Discard dependency-tool side effects
        run: git checkout -- analysis_options.yaml example/pubspec.lock

      - name: Guard migration scope
        shell: bash
        run: |
          allowed='^(lib/src/components/basic/input/file_input.dart|lib/src/components/basic/card.dart|lib/src/components/basic/icon.dart|lib/src/components/basic/text.dart|lib/src/components/behaviour/notice.dart|test/basic/semantic_surface_test.dart|widgetbook/lib/use_cases/basic/card_link.dart)$'
          unexpected=$(git status --short | awk '{print $2}' | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected modified paths:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check

      - name: Commit migration and formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/src/components/basic/input/file_input.dart \
                  lib/src/components/basic/card.dart \
                  lib/src/components/basic/icon.dart \
                  lib/src/components/basic/text.dart \
                  lib/src/components/behaviour/notice.dart \
                  test/basic/semantic_surface_test.dart \
                  widgetbook/lib/use_cases/basic/card_link.dart
          git commit -m 'refactor: use semantic feedback surfaces'
          git push origin HEAD:${{ github.head_ref }}

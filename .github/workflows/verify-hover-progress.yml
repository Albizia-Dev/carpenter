name: Verify hover and progress regressions

on:
  push:
    branches:
      - fix/hover-progress-elevation

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply canonical formatting
        run: >-
          dart format
          lib/src/components/basic/progress.dart
          lib/src/components/behaviour/drag_and_drop/drop_target.dart
          lib/src/components/collections/list_tile.dart
          test/collections/hover_stability_test.dart
          test/components/progress_test.dart

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/src/components/basic/progress.dart \
            lib/src/components/behaviour/drag_and_drop/drop_target.dart \
            lib/src/components/collections/list_tile.dart \
            test/collections/hover_stability_test.dart \
            test/components/progress_test.dart
          git commit -m "style: apply canonical Dart formatting"
          git push

      - name: Run regression tests
        run: >-
          flutter test
          test/collections/hover_stability_test.dart
          test/components/progress_test.dart
          test/collections/advanced_collections_test.dart

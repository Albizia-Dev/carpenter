name: Test 0.1.1

on:
  push:
    branches:
      - release/0.1.1-ui-primitives

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/basic/extended_primitives_test.dart test/collections/navigation_notifications_test.dart

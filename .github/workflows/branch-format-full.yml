name: Branch format full

on:
  push:
    branches:
      - feat/context-actions-0.2.1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/context-actions-0.2.1
      - name: Document changed public API
        run: |
          python3 - <<'PY'
          from pathlib import Path

          table = Path('lib/src/components/collections/table/table_column.dart')
          text = table.read_text()
          text = text.replace(
              '  const CarpenterTableColumn.custom({',
              '''  /// Creates a table column with caller-owned cell content and layout policy.\n  ///\n  /// [actionsBuilder] is optional semantic metadata for actions represented by\n  /// this column. Action-lane columns use it to expose the same actions through\n  /// contextual surfaces; ordinary custom columns may leave it null.\n  const CarpenterTableColumn.custom({''',
              1,
          )
          table.write_text(text)

          tree = Path('lib/src/components/collections/tree/tree_table.dart')
          text = tree.read_text()
          text = text.replace(
              'typedef CarpenterTreeTableActionsBuilder<T> =',
              '''/// Builds the primary and secondary semantic actions represented by a tree-table column.\ntypedef CarpenterTreeTableActionsBuilder<T> =''',
              1,
          )
          marker = '''  @Deprecated(\n    'Use CarpenterTreeTableColumn.custom(...) with an explicit width contract.',\n  )\n  const CarpenterTreeTableColumn({'''
          replacement = '''  /// Creates a tree-table column through the legacy flex-based width shorthand.\n  ///\n  /// Prefer [CarpenterTreeTableColumn.custom]. [actionsBuilder] is optional\n  /// semantic metadata used by action-lane contextual presentation.\n  @Deprecated(\n    'Use CarpenterTreeTableColumn.custom(...) with an explicit width contract.',\n  )\n  const CarpenterTreeTableColumn({'''
          text = text.replace(marker, replacement, 1)
          text = text.replace(
              '  const CarpenterTreeTableColumn.custom({',
              '''  /// Creates a tree-table column with an explicit width and caller-owned cell.\n  ///\n  /// [actionsBuilder] is optional semantic metadata for actions represented by\n  /// this column and is reused by contextual action presentation.\n  const CarpenterTreeTableColumn.custom({''',
              1,
          )
          tree.write_text(text)
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart format lib/src/components/collections/table/table_column.dart lib/src/components/collections/tree/tree_table.dart
      - name: Commit documentation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/components/collections/table/table_column.dart lib/src/components/collections/tree/tree_table.dart
          git commit -m "docs: document contextual table action API"
          git push

name: Format 0.1.4

on:
  push:
    branches:
      - fix/project-layout-foundations
    paths:
      - '.github/format-014.trigger'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve package language version
        run: flutter pub get

      - name: Format library
        run: dart format lib

      - name: Remove one-shot formatter
        run: |
          rm -f .github/format-014.trigger
          rm -f .github/workflows/format-014.yml

      - name: Commit formatted library
        shell: bash
        run: |
          set -euo pipefail
          git add lib
          git add -u .github/format-014.trigger .github/workflows/format-014.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style: format 0.1.4 library with package language version"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

name: Verify 0.1.2

on:
  push:
    branches:
      - release/0.1.2-example-and-ergonomics

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1.2-example-and-ergonomics
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format changed Dart surfaces
        run: >-
          dart format
          lib/src/components/basic/select/select.dart
          lib/src/components/basic/select/combo_box.dart
          lib/src/components/basic/select/autosuggest.dart
          lib/src/components/layout/patterns/page_body.dart
          lib/carpenter.dart
          test/basic/select_test.dart
          example/lib/demo_commands.dart
          example/lib/demo_routes.dart
          example/lib/demo_shell.dart
          example/lib/main.dart
          example/lib/pages/explorer_page.dart
          example/lib/pages/planning_page.dart
          example/lib/pages/project_page.dart
          example/lib/pages/settings_page.dart
          example/test/widget_test.dart
      - name: Commit formatting
        run: |
          git add lib test example
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format 0.1.2 surfaces"
          git push origin HEAD:release/0.1.2-example-and-ergonomics
      - name: Analyze library
        run: dart analyze lib
      - name: Test ergonomic controls
        run: flutter test test/basic/select_test.dart test/basic/combo_box_test.dart test/basic/autosuggest_test.dart
      - name: Install example dependencies
        working-directory: example
        run: flutter pub get
      - name: Analyze example
        working-directory: example
        run: dart analyze lib test
      - name: Test example
        working-directory: example
        run: flutter test
